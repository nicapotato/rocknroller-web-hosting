<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RockNRoller</title>
    <link rel="icon" type="image/png" href="/rocknroller-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0b0f;
        overflow: hidden;
        color: #ddd;
        font-family: monospace;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #status {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 1.25rem;
        box-sizing: border-box;
        text-align: center;
        color: #eee;
        font-size: 16px;
        letter-spacing: 0.02em;
        pointer-events: none;
        background: rgba(11, 11, 15, 0.72);
      }
      #status:empty {
        display: none;
      }
      #status.player-status--error {
        color: #e53935;
        pointer-events: auto;
        background: rgba(11, 11, 15, 0.88);
      }
      #notfound {
        padding: 3rem 1.5rem;
      }
      #notfound a {
        color: #ffde44;
      }
    </style>
  </head>
  <body>
    <!-- GitHub Pages serves this for unknown paths. If the first path segment
         looks like a version (e.g. /0.1.33/), boot the player pinned to it, so
         rocknroller.nicapotato.com/0.1.33 works without a directory per
         release. Anything else gets a plain not-found note. -->
    <script src="/coi-serviceworker.min.js"></script>
    <script>
      (function () {
        var seg = window.location.pathname.split("/").filter(Boolean)[0] || "";
        if (/^[0-9]+\.[0-9]+(\.[0-9A-Za-z.-]+)?$/.test(seg)) {
          window.RNR_VERSION = seg;
        }
      })();
    </script>
    <div id="status">loading…</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
      if (window.RNR_VERSION) {
        var s = document.createElement("script");
        s.src = "/assets/player.js";
        document.body.appendChild(s);
      } else {
        document.getElementById("status").remove();
        document.getElementById("canvas").remove();
        document.body.insertAdjacentHTML(
          "beforeend",
          '<div id="notfound"><p>404 — nothing here.</p>' +
            '<p><a href="/latest/">play latest</a> · <a href="/versions/">versions</a> · ' +
            '<a href="/about/">about</a> · <a href="/features/">features</a></p></div>'
        );
      }
    </script>
  </body>
</html>

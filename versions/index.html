<html lang="en">

    <meta charset="utf-8" />

    <link rel="icon" type="image/png" href="/rocknroller-icon.png" />

  <body>
    <main class="page">
      <h1 class="page__title">
        <img
          class="page__logo"
          src="/rocknroller-logo.png"
          alt="Rock N Roller"
          width="810"
          height="160"
        />
      </h1>
      <nav class="page__nav">
        <a href="/latest/">Play</a>
        <a href="/">About</a>
        <a href="/features/">Features</a>
        <a href="/demucs-stems/">Stems</a>
        <a href="/keybinds/">Keybinds</a>
        <a href="/configurations/">Settings</a>
        <a href="/versions/" aria-current="page">Versions</a>
      </nav>

      <div class="versions-head">
        <h1>Versions</h1>
        <div class="versions-head__actions">
          <button
            type="button"
            id="versionsGraphToggle"
            class="versions-sha-toggle"
            aria-pressed="false"
            aria-expanded="false"
            aria-controls="versionsGraph"
            title="Versions over time"
          >
            Graph
          </button>
          <button
            type="button"
            id="versionsShaToggle"
            class="versions-sha-toggle"
            aria-pressed="false"
          >
            Toggle SHA Key
          </button>
        </div>
      </div>

      <div id="versionsGraph" class="versions-graph" hidden>
        <div class="versions-graph__bar">
          <p class="versions-graph__legend">
            <span class="versions-graph__swatch versions-graph__swatch--release"></span>Release
            <span class="versions-graph__swatch versions-graph__swatch--dev"></span>Dev
          </p>
          <div class="versions-graph__modes" role="group" aria-label="Graph view">
            <button
              type="button"
              id="versionsGraphDetail"
              class="versions-sha-toggle"
              aria-pressed="true"
            >
              Detail
            </button>
            <button
              type="button"
              id="versionsGraphMonth"
              class="versions-sha-toggle"
              aria-pressed="false"
            >
              By month
            </button>
          </div>
        </div>
        <div class="versions-graph__canvas-wrap">
          <canvas
            id="versionsGraphCanvas"
            width="800"
            height="300"
            aria-label="Rock N Roller versions over time"
          ></canvas>
          <div id="versionsGraphTooltip" class="versions-graph__tooltip" hidden></div>
        </div>
      </div>

      <div id="versionsError" class="fineprint" hidden></div>
      <div id="versionsWrap" class="versions-wrap">
        <div class="versions-scroll">
          <table class="versions" id="versionsTable" aria-busy="true">
            <thead>
              <tr>
                <th>Version</th>
                <th>Released</th>
                <th>Web</th>
                <th>macOS (Apple&nbsp;Silicon)</th>
                <th>macOS (Intel)</th>
                <th>Windows</th>
              </tr>
            </thead>
            <tbody id="versionsBody">
              <tr class="versions-skel-row" aria-hidden="true"><td><span class="versions-skel versions-skel--v pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--d pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td></tr>
              <tr class="versions-skel-row" aria-hidden="true"><td><span class="versions-skel versions-skel--v pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--d pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td></tr>
              <tr class="versions-skel-row" aria-hidden="true"><td><span class="versions-skel versions-skel--v pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--d pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td></tr>
              <tr class="versions-skel-row" aria-hidden="true"><td><span class="versions-skel versions-skel--v pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--d pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td></tr>
              <tr class="versions-skel-row" aria-hidden="true"><td><span class="versions-skel versions-skel--v pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--d pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td></tr>
              <tr class="versions-skel-row" aria-hidden="true"><td><span class="versions-skel versions-skel--v pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--d pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td></tr>
              <tr class="versions-skel-row" aria-hidden="true"><td><span class="versions-skel versions-skel--v pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--d pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td></tr>
              <tr class="versions-skel-row" aria-hidden="true"><td><span class="versions-skel versions-skel--v pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--d pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td><td><span class="versions-skel versions-skel--a pixel-skeleton"></span><span class="versions-skel versions-skel--sha pixel-skeleton"></span></td></tr>
            </tbody>
          </table>
        </div>
      </div>

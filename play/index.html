<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      /* Legacy /play/?v=X.Y.Z → /X.Y.Z/ (preserves ?demo= and other params). */
      (function () {
        var params = new URLSearchParams(window.location.search);
        var v = params.get("v");
        params.delete("v");
        var dest =
          v && /^[0-9A-Za-z.-]+$/.test(v) ? "/" + v + "/" : "/latest/";
        var q = params.toString();
        if (q) dest += "?" + q;
        window.location.replace(dest);
      })();
    </script>
  </head>
  <body>
    <p style="color: #e8eaed; background: #0d0d0d; font-family: monospace; padding: 2rem">
      Redirecting…
    </p>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RockNRoller — latest</title>
    <link rel="icon" type="image/png" href="/rocknroller-icon.png" />
    <link rel="stylesheet" href="/assets/wasm-loading-wave.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0b0f;
        overflow: hidden;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #status {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 1.25rem;
        box-sizing: border-box;
        text-align: center;
        color: #eee;
        font-family: monospace;
        font-size: 16px;
        letter-spacing: 0.02em;
        pointer-events: none;
        background: rgba(11, 11, 15, 0.72);
      }
      #status:empty {
        display: none;
      }
      #status.player-status--error {
        color: #e53935;
        pointer-events: auto;
        background: rgba(11, 11, 15, 0.88);
      }
    </style>
  </head>
  <body>
    <!-- COOP/COEP via service worker: GitHub Pages cannot set response headers,
         and SharedArrayBuffer (pthreads) needs them. Root path = origin-wide
         scope. First visit reloads once after registration. -->
    <script src="/coi-serviceworker.min.js"></script>
    <div id="loading"><div class="loading-wave" id="loading-wave" aria-hidden="true"></div><div id="loading-progress" aria-live="polite"></div></div>
    <div id="status"></div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
      window.RNR_VERSION = "latest";
    </script>
    <script src="/assets/wasm-loading-wave.js"></script>
    <script src="/assets/player.js"></script>
  </body>
</html>
